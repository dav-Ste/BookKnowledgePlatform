services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      # Allow overriding the SA password via environment variable. Default is for local development only.
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-LocalOnly!ChangeMe123}"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql

  rabbitmq:
    # Image can be overridden via RABBITMQ_IMAGE env var (example: rabbitmq:3.11-management)
    image: "${RABBITMQ_IMAGE:-rabbitmq:3.11-management}"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq

  qdrant:
    # Image can be overridden via QDRANT_IMAGE env var (example: qdrant/qdrant:v1.2.0)
    image: "${QDRANT_IMAGE:-qdrant/qdrant:latest}"
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    # Image can be overridden via MINIO_IMAGE env var (example: minio/minio:latest)
    image: "${MINIO_IMAGE:-minio/minio:latest}"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: localadmin
      # Allow overriding the MinIO root password from environment
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-LocalOnly!ChangeMe123}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  sql-data:
  rabbit-data:
  qdrant-data:
  minio-data:
